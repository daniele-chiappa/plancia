version: 2
updates:
  # npm dependencies (all devDependencies — plancia ships zero runtime deps)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # A release waits two weeks before its pull request: the rule of the
    # projects for dependencies (security updates are not delayed).
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Minor and patch updates come as one PR; each major update keeps its own.
    groups:
      dev-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      # Test-only copies of the peers, kept on the majors gosidian runs.
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      # vue-tsc does not run on TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types of the Node the CI and the build run, 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # plancia-diagrams (diagrams/): its runtime dependencies are pinned on
  # purpose (ADR-006), so only the development ones are grouped here.
  - package-ecosystem: "npm"
    directory: "/diagrams"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # A release waits two weeks before its pull request: the rule of the
    # projects for dependencies (security updates are not delayed).
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      diagrams-dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The package reads Mermaid's parsed data and its newest syntaxes
      # (venn-beta, ishikawa): a major of Mermaid is a pass of its own,
      # with the conversion tests and a run in a consumer.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    # A release waits two weeks before its pull request: the rule of the
    # projects for dependencies (security updates are not delayed).
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
